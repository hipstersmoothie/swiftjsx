name: SwiftJSXDemo

options:
  bundleIdPrefix: dev.swiftjsx
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  SwiftJSX:
    path: ../..

settings:
  base:
    SWIFT_VERSION: "6.0"
    # The copy-bundle script writes into the app product; keep it unsandboxed.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    # Simulator builds don't need a team; set DEVELOPMENT_TEAM to run on a device.
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO

targets:
  SwiftJSXDemo:
    type: application
    platform: iOS
    sources:
      - path: SwiftJSXDemo
    dependencies:
      - package: SwiftJSX
        product: SwiftJSX
    settings:
      base:
        PRODUCT_NAME: SwiftJSXDemo
        PRODUCT_BUNDLE_IDENTIFIER: dev.swiftjsx.demo
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SwiftJSXDemo/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SwiftJSX Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Absolute host path of the dev bundle, written into Info.plist as
        # SwiftJSXDevBundlePath. Only set for Debug simulator builds: the
        # simulator can read the host filesystem, so `npm run dev` hot-reloads.
        SWIFTJSX_DEV_BUNDLE: ""
        SWIFTJSX_DEV_BUNDLE[config=Debug][sdk=iphonesimulator*]: $(SRCROOT)/../../build/app.js
    preBuildScripts:
      - name: Copy app.js bundle
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/app.js
        script: |
          # Release builds get the production bundle (React's production build,
          # minified); Debug builds the development one (Fast Refresh, warnings).
          set -euo pipefail
          SRC="${SRCROOT}/../../build/app.js"
          if [ "$CONFIGURATION" = "Release" ]; then SRC="${SRCROOT}/../../build/app.production.js"; fi
          DEST_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          if [ ! -f "$SRC" ]; then
            echo "error: SwiftJSX bundle not found at $SRC. Run 'npm install && npm run build' at the repo root first."
            exit 1
          fi
          mkdir -p "$DEST_DIR"
          cp -f "$SRC" "$DEST_DIR/app.js"
          echo "Copied $SRC -> $DEST_DIR/app.js"

    postBuildScripts:
      - name: Embed NativeScript add-on (optional)
        basedOnDependencyAnalysis: false
        script: |
          # The `native` backend's add-on (scripts/build-nativescript.sh). Optional:
          # without it the app runs and `native` is unavailable. Copied and signed,
          # not linked: SwiftJSX dlopen()s it at runtime.
          set -euo pipefail
          XCF="${SRCROOT}/../../build/nativescript/NativeScript.xcframework"
          DEST="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/NativeScript.framework"
          rm -rf "$DEST"
          if [ ! -d "$XCF" ]; then
            echo "note: NativeScript add-on not built; the native backend will be unavailable"
            exit 0
          fi
          case "$PLATFORM_NAME" in
            iphonesimulator) SLICE=ios-arm64-simulator ;;
            *) SLICE=ios-arm64 ;;
          esac
          mkdir -p "$(dirname "$DEST")"
          ditto "$XCF/$SLICE/NativeScript.framework" "$DEST"
          if [ "${CODE_SIGNING_ALLOWED:-NO}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$DEST"
          fi

  # End-to-end tests of the gallery (simulator):
  #   xcodebuild test -project SwiftJSXDemo.xcodeproj -scheme SwiftJSXDemo \
  #     -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
  SwiftJSXDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SwiftJSXDemoUITests
    dependencies:
      - target: SwiftJSXDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.swiftjsx.demo.uitests

schemes:
  SwiftJSXDemo:
    build:
      targets:
        SwiftJSXDemo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SwiftJSXDemoUITests
    archive:
      config: Release
