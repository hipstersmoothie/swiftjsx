# SPIKE: iOS harness. Needs the NativeScript iOS-simulator Node-API add-on built
# from NativeScript/napi-ios (see ../README.md); set NS_ADDON below.
name: NSSpike
options:
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    NS_ADDON: /tmp/ns-spike/addon/NativeScript.framework
packages:
  NativeScriptSpike:
    path: ..
targets:
  NSSpike:
    type: application
    platform: iOS
    sources: [NSSpike]
    dependencies:
      - package: NativeScriptSpike
        product: NodeAPIJSC
      # Embedded (copied + signed) but not linked: we dlopen it at runtime.
      - framework: /tmp/ns-spike/addon/NativeScript.framework
        embed: true
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.swiftjsx.nsspike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        # The add-on resolves napi_* from the app binary.
        OTHER_LDFLAGS: ["-Wl,-export_dynamic"]
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
